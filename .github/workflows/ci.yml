name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python + dependencies
        run: |
          uv python install 3.13
          uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest tests/ -q
