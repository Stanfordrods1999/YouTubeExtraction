[project]
name = "youtubeextraction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "click>=8.0.0",
    "curl-cffi>=0.15.0",
    "fastapi[standard]>=0.136.3",
    "flake8>=6.0.0",
    "flake8-bugbear>=23.0.0",
    "flake8-docstrings>=1.7.0",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langgraph-api>=0.11.0",
    "langgraph-cli[inmem]>=0.4.26",
    "numpy>=2.5.0",
    "openai>=2.45.0",
    "pydantic-settings>=2.14.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=1.3.0",
    "selenium==4.26.1",
    "seleniumbase==4.32.12",
    "setuptools>=82.0.1",
    "supabase>=2.30.0",
    "trafilatura>=2.1.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# seleniumbase (a legacy-scraper dep) ships a pytest plugin that imports
# pkg_resources via pytest-html; setuptools>=82 removed it, which crashes
# collection. The pipeline suite doesn't need either plugin.
addopts = "-p no:seleniumbase -p no:sb_pytest -p no:html"
